[project]
name = "node-plane-sdk"
# The API contract version it is built for (`api/openapi.json`).
version = "1.0.0"
description = "Python client of the Node Plane API"
requires-python = ">=3.11"
dependencies = ["aiohttp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["node_plane_sdk"]
