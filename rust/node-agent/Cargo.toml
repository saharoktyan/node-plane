[package]
name = "node-plane-agent"
version = "1.0.0-beta.11"
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tonic-build = "0.12"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
miniz_oxide = "0.8"
node-plane-relay = { path = "../node-plane-relay", default-features = false, features = ["serve"] }
prost = "0.13"
# Already in the tree through rustls; used for SHA-256.
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls"] }
