[package]
name = "node-plane-cli"
version = "0.4.3-alpha.71"
edition = "2024"
rust-version = "1.90"
description = "Node Plane workstation installation assistant"
license = "Apache-2.0"
repository = "https://github.com/saharoktyan/node-plane"

[[bin]]
name = "node-plane"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
fs2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
semver = "1"
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "process"] }
zeroize = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axoupdater = { version = "0.10.2", features = ["blocking"] }
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
