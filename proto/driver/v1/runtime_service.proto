syntax = "proto3";

package nodeplane.driver.v1;

import "driver/v1/types.proto";

service RuntimeService {
  // Explicit operator cancellation, bound to a durable restart ticket.
  rpc ForceRecovery(ForceRecoveryRequest) returns (BackendNodeSettingsResult);
  rpc BackendNodeAction(BackendNodeActionRequest) returns (BackendNodeSettingsResult);
  // Explicit backend-owned path; does not access legacy server/profile tables.
  rpc DecommissionNode(DecommissionNodeRequest) returns (DecommissionNodeResponse);
  rpc ApplyBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (StartOperationResponse);
  // Idempotent preparation of an already installed agent; no legacy registry read.
  rpc PrepareBackendNode(PrepareBackendNodeRequest) returns (BackendNodeSettingsResult);
  rpc RecoverBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (BackendNodeSettingsResult);
  rpc ResolveBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (BackendNodeSettingsResult);
  rpc GetBackendXrayPublic(GetBackendXrayPublicRequest) returns (BackendXrayPublicResult);
  rpc RefreshAwgConfig(RefreshAwgConfigRequest) returns (RefreshAwgConfigResponse);
  rpc ApplyAdmissionPolicy(ApplyAdmissionPolicyRequest) returns (ApplyAdmissionPolicyResponse);
}

message BackendNodeActionRequest {
  string node_key = 1;
  string command_id = 2;
  string action = 3;
  string intent_json = 4;
  bool recover = 5;
}

message DecommissionNodeRequest {
  string node_key = 1;
  string command_id = 2;
  string phase = 3; // prepare, delete_runtime, uninstall
}

message DecommissionNodeResponse {
  string phase = 1;
  string summary = 2;
}

message ApplyBackendNodeSettingsRequest {
  string node_key = 1;
  uint64 desired_revision = 2;
  string protocols_json = 3;
  string settings_json = 4;
}

message PrepareBackendNodeRequest {
  string node_key = 1;
}

message BackendNodeSettingsResult {
  string result_json = 1;
}

message GetBackendXrayPublicRequest {
  string node_key = 1;
}

message BackendXrayPublicResult {
  string node_key = 1;
  string metadata_json = 2;
}

message RefreshAwgConfigRequest {
  string node_key = 1;
  string wg_conf = 2;
  string profile_name = 3;
}

message RefreshAwgConfigResponse {
  string wg_conf = 1;
  string vpn_key = 2;
}

message ForceRecoveryRequest {
  string node_key = 1;
  string ticket_id = 2;
  string command_id = 3;
  string operation_kind = 4;
  string intent_json = 5;
  string phase = 6;
}

// Concurrent source limits for the node's VLESS clients (VPN plan, section 5).
// A full snapshot: clients absent from it have no limit. Revisions only grow;
// an older snapshot is ignored and the stored revision is returned.
message AdmissionClientPolicy {
  string email = 1;
  uint32 max_sources = 2;
  // "observe" or "enforce".
  string mode = 3;
  uint64 window_seconds = 4;
  uint64 cooldown_seconds = 5;
}

message ApplyAdmissionPolicyRequest {
  uint64 revision = 1;
  repeated AdmissionClientPolicy clients = 2;
  string node_key = 3;
}

message ApplyAdmissionPolicyResponse {
  string node_key = 1;
  uint64 revision = 2;
}
