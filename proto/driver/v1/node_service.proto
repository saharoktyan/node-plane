syntax = "proto3";

package nodeplane.driver.v1;

import "driver/v1/types.proto";

service NodeService {
  rpc GetNodeDiagnostics(GetNodeDiagnosticsRequest) returns (GetNodeDiagnosticsResponse);
  // Backend-owned read path: only the configured agent target is consulted.
  rpc InspectBackendNode(InspectBackendNodeRequest) returns (BackendNodeObservation);
  // Dials an agent installed with a one-time token, issues its certificate
  // and remembers its target. No SSH or sudo on the node.
  rpc EnrollAgent(EnrollAgentRequest) returns (EnrollAgentResponse);
  // Asks the agent to install a signed release and restart into it.
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
}

message UpdateAgentRequest {
  string node_key = 1;
  // Where the release assets are published, without a trailing slash.
  string release_url = 2;
  string version = 3;
}

message UpdateAgentResponse {
  // "updating": the agent restarts into the new version; "current": nothing to do.
  string status = 1;
  string version = 2;
  // A version the agent's rollback guard put back, if any.
  string rolled_back = 3;
}

message EnrollAgentRequest {
  string node_key = 1;
  // host:port the agent listens on; its certificate names the host.
  string target = 2;
  string token = 3;
  // This controller installation, and the node keys it retired for good:
  // only those may hand their agent over to another node.
  string controller_id = 4;
  repeated string retired_node_keys = 5;
  // Keep the agent port for this controller's address only; for a
  // controller with a static address. Otherwise mutual TLS alone guards it.
  bool restrict_to_controller = 6;
}

message EnrollAgentResponse {
  // How the agent restricted its port, for the operator.
  string firewall = 1;
  // Where the agent archived another controller's journal, if it did.
  string journal_archive = 2;
}

message GetNodeDiagnosticsRequest {
  string node_key = 1;
}

message GetNodeDiagnosticsResponse {
  string node_key = 1;
  string summary = 2;
  repeated DiagnosticItem items = 3;
}

message InspectBackendNodeRequest {
  string node_key = 1;
}

message BackendNodeObservation {
  string node_key = 1;
  string health_state = 2;
  string runtime_version = 3;
  string runtime_commit = 4;
  bool xray_config_present = 5;
  bool awg_config_present = 6;
  string agent_version = 7;
  string agent_commit = 8;
  // The version the agent's last self-update rolled back from, if any.
  string agent_update_rolled_back = 9;
  string host_id = 10;
}
