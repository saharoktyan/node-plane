syntax = "proto3";

package nodeplane.driver.v1;

message DriverError {
  string code = 1;
  string summary = 2;
  string detail = 3;
  bool retryable = 4;
}

message StartOperationResponse {
  string operation_id = 1;
}

message XraySpec {
  string profile_name = 1;
  string uuid = 2;
  string short_id = 3;
}

message DiagnosticItem {
  string kind = 1;
  string status = 2;
  string summary = 3;
  string detail = 4;
}

message Operation {
  string operation_id = 1;
  string kind = 2;
  string status = 3;
  string node_key = 4;
  string profile_name = 5;
  string started_at = 6;
  string updated_at = 7;
  string finished_at = 8;
  string progress_message = 9;
  DriverError error = 10;
  string result_json = 11;
}

message OperationEvent {
  Operation operation = 1;
  string log_line = 2;
}
