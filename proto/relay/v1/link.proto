syntax = "proto3";

package nodeplane.relay.v1;

// The controller's outgoing connection to its relay. The controller dials
// out and holds one Attach stream; the relay sends HTTP requests from the
// web cabinet over it and the controller answers each by id.
//
// Both sides have Ed25519 keys and know each other's public key: the
// controller hands them over through the relay node's agent. Attach proves
// both keys every time.
service Link {
  // Metadata `x-node-plane-link-key` (hex) names the controller's key and
  // `x-node-plane-link-nonce` (hex, 32 bytes) is its challenge to the relay.
  // The relay answers with Challenge, the controller with Hello.
  rpc Attach(stream LinkMessage) returns (stream RelayMessage);
}

message Header {
  string name = 1;
  bytes value = 2;
}

// Relay to controller.
message RelayMessage {
  oneof message {
    Request request = 1;
    Challenge challenge = 2;
  }
}

message Challenge {
  bytes nonce = 1;
  // Relay key over "node-plane relay attach relay" || link nonce || link_key
  bytes signature = 2;
}

message Request {
  uint64 id = 1;
  string method = 2;
  string path_and_query = 3;
  // Only the headers the relay passes on; never X-Node-Plane-*.
  repeated Header headers = 4;
  bytes body = 5;
  // The client's address as the relay sees it; the link passes it on as
  // X-Node-Plane-Client for the controller's sign-in limits.
  string client = 6;
}

// Controller to relay.
message LinkMessage {
  oneof message {
    Hello hello = 1;
    Response response = 2;
  }
}

message Hello {
  string version = 1;
  // Link key over "node-plane relay attach link" || challenge nonce || relay_key
  bytes signature = 2;
}

message Response {
  uint64 id = 1;
  uint32 status = 2;
  repeated Header headers = 3;
  bytes body = 4;
}
