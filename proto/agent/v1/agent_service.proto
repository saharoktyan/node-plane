syntax = "proto3";

package nodeplane.agent.v1;

import "agent/v1/types.proto";

service NodeAgentService {
  // Explicit operator cancellation, bound to a durable restart ticket.
  rpc ForceRecovery(ForceRecoveryRequest) returns (RuntimeCommandResponse);
  rpc BackendNodeAction(BackendNodeActionRequest) returns (RuntimeCommandResponse);
  rpc ResolveProfileIntent(ApplyProfileIntentRequest) returns (ProfileInspection);
  rpc RecoverProfileIntent(ApplyProfileIntentRequest) returns (RuntimeCommandResponse);
  rpc ApplyProfileIntent(ApplyProfileIntentRequest) returns (RuntimeCommandResponse);
  rpc InspectProfile(InspectProfileRequest) returns (ProfileInspection);
  rpc GetRuntimeFacts(AgentEmpty) returns (RuntimeFacts);
  rpc GetNodeHealth(AgentEmpty) returns (LocalHealth);
  rpc ListRemoteProfiles(ListRemoteProfilesRequest) returns (ListRemoteProfilesResponse);
  rpc RunDiagnostics(RunDiagnosticsRequest) returns (RunDiagnosticsResponse);
  rpc CheckPorts(CheckPortsRequest) returns (CheckPortsResponse);
  rpc SyncNodeEnv(SyncNodeEnvRequest) returns (SyncNodeEnvResponse);
  rpc OpenPorts(OpenPortsRequest) returns (OpenPortsResponse);
  rpc SyncRuntimeFiles(SyncRuntimeFilesRequest) returns (SyncRuntimeFilesResponse);
  rpc SyncXray(SyncXrayRequest) returns (SyncXrayResponse);
  rpc ApplyNodeSettings(ApplyNodeSettingsRequest) returns (RuntimeCommandResponse);
  rpc ApplyBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (RuntimeCommandResponse);
  rpc RecoverBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (RuntimeCommandResponse);
  rpc ResolveBackendNodeSettings(ApplyBackendNodeSettingsRequest) returns (RuntimeCommandResponse);
  rpc GetBackendXrayPublic(AgentEmpty) returns (BackendXrayPublic);
  rpc RefreshAwgConfig(RefreshAwgConfigRequest) returns (RefreshAwgConfigResponse);
  rpc ApplyAdmissionPolicy(ApplyAdmissionPolicyRequest) returns (ApplyAdmissionPolicyResponse);
  rpc ObserveSessions(ObserveSessionsRequest) returns (ObserveSessionsResponse);
  rpc ApplyRatePolicy(ApplyRatePolicyRequest) returns (ApplyRatePolicyResponse);
  rpc InstallDocker(InstallDockerRequest) returns (InstallDockerResponse);
  rpc DeleteRuntime(DeleteRuntimeRequest) returns (DeleteRuntimeResponse);
  rpc UninstallAgent(AgentEmpty) returns (RuntimeCommandResponse);
  // Backend-owned deletion: preparation fences new mutations only after all
  // managed profiles have a successful delete as their latest intent.
  rpc PrepareDecommission(DecommissionRequest) returns (RuntimeCommandResponse);
  rpc DeleteRuntimeForDecommission(DecommissionRequest) returns (DeleteRuntimeResponse);
  rpc UninstallAgentForDecommission(DecommissionRequest) returns (RuntimeCommandResponse);
  rpc InitXray(InitXrayRequest) returns (InitXrayResponse);
  rpc DeployXray(AgentEmpty) returns (RuntimeCommandResponse);
  rpc InitAwg(AgentEmpty) returns (RuntimeCommandResponse);
  rpc DeployAwg(AgentEmpty) returns (RuntimeCommandResponse);
  rpc GetAwgEntropy(AgentEmpty) returns (RuntimeCommandResponse);
  rpc RegenerateAwgEntropy(AgentEmpty) returns (RuntimeCommandResponse);
  rpc PathExists(PathExistsRequest) returns (PathExistsResponse);
  rpc RemoveAuthorizedKey(RemoveAuthorizedKeyRequest) returns (RemoveAuthorizedKeyResponse);
  rpc AddXrayUser(AddXrayUserRequest) returns (RuntimeCommandResponse);
  rpc DeleteXrayUser(DeleteProfileRequest) returns (RuntimeCommandResponse);
  rpc AddAwgUser(AddAwgUserRequest) returns (RuntimeCommandResponse);
  rpc DeleteAwgUser(DeleteProfileRequest) returns (RuntimeCommandResponse);
}

message BackendNodeActionRequest {
  string node_key = 1;
  string command_id = 2;
  string action = 3;
  string intent_json = 4;
  bool recover = 5;
}

message ApplyProfileIntentRequest {
  string command_id = 1;
  string protocol_kind = 2;
  string profile_name = 3;
  uint64 desired_revision = 4;
  string action = 5;
  string uuid = 6;
  string short_id = 7;
}

message InspectProfileRequest {
  string protocol_kind = 1;
  string profile_name = 2;
  string expected_xray_uuid = 3;
}

message ProfileInspection {
  bool disk_present = 1;
  bool live_present = 2;
  bool identity_matches = 3;
  bool config_available = 4;
}

message ListRemoteProfilesRequest {
  string protocol_kind = 1;
}

message ListRemoteProfilesResponse {
  repeated RemoteProfileRecord items = 1;
}

message RunDiagnosticsRequest {}

message RunDiagnosticsResponse {
  string summary = 1;
  repeated DiagnosticItem items = 2;
}

message CheckPortsRequest {
  repeated PortCheckSpec items = 1;
}

message CheckPortsResponse {
  string summary = 1;
  repeated PortStatus items = 2;
}

message SyncNodeEnvRequest {
  string content = 1;
}

message SyncNodeEnvResponse {
  string summary = 1;
  string path = 2;
}

message OpenPortsRequest {
  repeated PortCheckSpec items = 1;
}

message OpenPortsResponse {
  string summary = 1;
  repeated PortStatus items = 2;
}

message SyncRuntimeFilesRequest {
  repeated RuntimeFileSpec files = 1;
}

message SyncRuntimeFilesResponse {
  string summary = 1;
  uint32 written_files = 2;
}

message SyncXrayRequest {
  string config_path = 1;
  string public_host = 2;
  string flow = 3;
  string image = 4;
}

message SyncXrayResponse {
  string summary = 1;
  string generated_json = 2;
}

message ApplyNodeSettingsRequest {
  string xray_config_path = 1;
  string xray_sni = 2;
  uint32 xray_tcp_port = 3;
  uint32 xray_xhttp_port = 4;
  string xray_xhttp_path_prefix = 5;
  bool apply_xray = 6;
  bool apply_awg = 7;
}

message ApplyBackendNodeSettingsRequest {
  string command_id = 1;
  uint64 desired_revision = 2;
  string protocols_json = 3;
  string settings_json = 4;
  string node_key = 5;
}

message BackendXrayPublic {
  string metadata_json = 1;
}

message RefreshAwgConfigRequest {
  string wg_conf = 1;
  string profile_name = 2;
}

message RefreshAwgConfigResponse {
  string wg_conf = 1;
  string vpn_key = 2;
}

message InstallDockerRequest {}

message InstallDockerResponse {
  string summary = 1;
}

message DeleteRuntimeRequest {
  bool preserve_config = 1;
}

message DecommissionRequest {
  string command_id = 1;
  string bot_public_key = 2; // uninstall phase only
}

message DeleteRuntimeResponse {
  string summary = 1;
}

message InitXrayRequest {
  string config_path = 1;
  string public_host = 2;
  string sni_host = 3;
  uint32 tcp_port = 4;
  uint32 xhttp_port = 5;
  string xhttp_path_prefix = 6;
  string flow = 7;
  string image = 8;
}

message InitXrayResponse {
  string summary = 1;
  string generated_json = 2;
}

message RuntimeCommandResponse {
  string summary = 1;
  string payload_json = 2;
}

message PathExistsRequest {
  string path = 1;
}

message PathExistsResponse {
  bool exists = 1;
}

message RemoveAuthorizedKeyRequest {
  string public_key = 1;
}

message RemoveAuthorizedKeyResponse {
  string summary = 1;
  bool removed = 2;
}

message AddXrayUserRequest {
  string profile_name = 1;
  string uuid = 2;
  string short_id = 3;
}

message AddAwgUserRequest {
  string profile_name = 1;
}

message DeleteProfileRequest {
  string profile_name = 1;
}

message ForceRecoveryRequest {
  string node_key = 1;
  string ticket_id = 2;
  string command_id = 3;
  string operation_kind = 4;
  string intent_json = 5;
  string phase = 6;
}

// Concurrent source limits for the node's VLESS clients (VPN plan, section 5).
// A full snapshot: clients absent from it have no limit. Revisions only grow;
// an older snapshot is ignored and the stored revision is returned.
message AdmissionClientPolicy {
  string email = 1;
  uint32 max_sources = 2;
  // "observe" or "enforce".
  string mode = 3;
  uint64 window_seconds = 4;
  uint64 cooldown_seconds = 5;
}

message ApplyAdmissionPolicyRequest {
  uint64 revision = 1;
  repeated AdmissionClientPolicy clients = 2;
}

message ApplyAdmissionPolicyResponse {
  uint64 revision = 1;
}

// What the admission loop saw, without addresses (VPN plan, section 5).
// Events are buffered in agent memory and numbered within one agent run
// (`boot_id`); a new run starts again from 1. Pass the last seen boot id and
// sequence; a different boot id returns everything buffered.
message AdmissionEvent {
  uint64 sequence = 1;
  string email = 2;
  // "evicted" or "would_evict".
  string kind = 3;
  // Unix seconds.
  int64 occurred_at = 4;
}

message SessionObservation {
  string email = 1;
  uint32 active_sources = 2;
  uint32 blocked_sources = 3;
}

message ObserveSessionsRequest {
  string boot_id = 1;
  uint64 after_sequence = 2;
}

message ObserveSessionsResponse {
  string boot_id = 1;
  repeated AdmissionEvent events = 2;
  repeated SessionObservation sessions = 3;
  // Events after `after_sequence` were dropped from the bounded buffer.
  bool truncated = 4;
}

// Speed limits per client (VPN plan, section 11d). The node's full snapshot;
// a revision not newer than the agent's own is ignored. Rates in kbit/s,
// 0 = no limit in that direction.
message RateClientPolicy {
  // "xray" (the Xray email) or "awg" (the peer name).
  string protocol = 1;
  string name = 2;
  uint64 up_kbit = 3;
  uint64 down_kbit = 4;
}

message ApplyRatePolicyRequest {
  uint64 revision = 1;
  repeated RateClientPolicy clients = 2;
}

// Outcome of the latest enforcement pass for one protocol.
message RateProtocolStatus {
  string protocol = 1;
  // "applied", "pending", "failed" or "unsupported".
  string state = 2;
  string detail = 3;
}

message ApplyRatePolicyResponse {
  uint64 revision = 1;
  repeated RateProtocolStatus protocols = 2;
}

// Served without TLS before the node has a certificate. Nothing exchanged
// is secret: both sides prove the one-time token with HMACs bound to the
// node key and the agent's public key, and the token never crosses the wire.
service NodeEnrollmentService {
  rpc Challenge(EnrollmentChallengeRequest) returns (EnrollmentChallengeResponse);
  rpc Complete(EnrollmentCompleteRequest) returns (EnrollmentCompleteResponse);
}

message EnrollmentChallengeRequest {
  bytes nonce = 1;
}

message EnrollmentChallengeResponse {
  string node_key = 1;
  // DER SubjectPublicKeyInfo of the key the agent generated.
  bytes public_key = 2;
  bytes proof = 3;
}

message EnrollmentCompleteRequest {
  string ca_pem = 1;
  string certificate_pem = 2;
  bytes proof = 3;
}

message EnrollmentCompleteResponse {
  // How the agent port was restricted to the controller, for the operator.
  string firewall = 1;
}
