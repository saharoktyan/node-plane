[project]
name = "node-plane-controller"
version = "0.6.0-alpha.2"
description = "Node Plane controller and Telegram adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
    "certifi==2026.10.19",
    "qrcode==8.2",
    "pillow==11.3.0",
    "psycopg[binary]==3.2.13",
    "grpcio==1.74.0",
    "protobuf==6.31.1",
]

[dependency-groups]
backend = [
    "argon2-cffi==25.1.0",
    "webauthn==3.0.1",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]
# The bot alone, as a node installs it (see app/backend/bot_package.py).
telegram = ["aiogram==3.31.0", "certifi==2026.10.19", "cryptography==50.0.2", "pillow==11.3.0", "qrcode==8.2"]
dev = ["grpcio-tools==1.74.0", "httpx==0.28.1", "uv==0.13.6"]

[tool.uv]
package = false
default-groups = ["backend", "telegram", "dev"]
