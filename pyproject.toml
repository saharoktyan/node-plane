[project]
name = "node-plane-controller"
version = "1.0.0-alpha.18"
description = "Node Plane controller and Telegram adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
    "qrcode==8.2",
    "pillow==11.3.0",
    "psycopg[binary]==3.2.13",
    "grpcio==1.74.0",
    "protobuf==6.31.1",
]

[dependency-groups]
backend = ["fastapi==0.141.1", "uvicorn==0.54.0"]
telegram = ["aiogram==3.31.0"]
dev = ["pytest==8.4.2", "grpcio-tools==1.74.0", "httpx==0.28.1", "uv==0.12.23"]

[tool.uv]
package = false
default-groups = ["backend", "telegram", "dev"]
