name: Workstation checks

on:
  push:
    branches: [dev, main]
    paths:
      - 'rust/node-plane-cli/**'
      - 'dist-workspace.toml'
      - 'scripts/install_workstation.sh'
      - 'scripts/install_workstation.ps1'
      - 'tests/workstation_installer_windows.ps1'
      - '.github/workflows/workstation.yml'
  pull_request:
    paths:
      - 'rust/node-plane-cli/**'
      - 'dist-workspace.toml'
      - 'scripts/install_workstation.sh'
      - 'scripts/install_workstation.ps1'
      - 'tests/workstation_installer_windows.ps1'
      - '.github/workflows/workstation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workstation-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/node-plane-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.90.0 fmt --check
      - name: Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n ../../scripts/install_workstation.sh
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ../../scripts/install_workstation.ps1),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Windows installer release discovery (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ../../tests/workstation_installer_windows.ps1'
      - name: Lint
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Linux server tools for SSH fixtures
        if: runner.os == 'macOS'
        run: |
          brew install coreutils flock
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Tests
        # Filesystem lock and SSH fixtures share temporary state within some
        # runners. Serial execution keeps the suite deterministic on every OS.
        run: cargo +1.90.0 test --locked -- --test-threads=1
      - name: Command smoke test
        run: cargo +1.90.0 run --locked -- --help
