name: Server release artifacts
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal && rustup default 1.90.0
      - uses: ./.github/actions/release-rust-cache
        continue-on-error: true
        with:
          key: server-linux-amd64
          mode: restore
      - name: Verify third-party license notices
        run: |
          mkdir -p "$RUNNER_TEMP/license-tools"
          curl --fail --location --retry 3 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/cargo-about.tar.gz"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP/license-tools" --strip-components=1
          python3 -m unittest tests.test_third_party_licenses
          python3 scripts/generate_third_party_licenses.py --check --cargo-about "$RUNNER_TEMP/license-tools/cargo-about"
      - name: Build server artifacts
        # Exercise the packaged installer before publishing its archive.
        run: |
          python3 -m unittest tests.test_controller_release
          bash scripts/build_release_stack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-server
          path: dist/release-stack/*
          if-no-files-found: error
      - uses: ./.github/actions/release-rust-cache
        continue-on-error: true
        with:
          key: server-linux-amd64
          mode: save
